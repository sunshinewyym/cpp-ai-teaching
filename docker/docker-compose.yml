services:
  runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner
    container_name: ppt-ai-runner
    restart: unless-stopped
    init: true
    network_mode: none
    read_only: true
    volumes:
      - runner-socket:/run/cpp-runner
    tmpfs:
      - /tmp/cpp-runner:exec,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'); try { process.exit(fs.statSync('/run/cpp-runner/runner.sock').isSocket() ? 0 : 1); } catch { process.exit(1); }"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: ppt-ai-server
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    env_file:
      - ../server/.env
    volumes:
      - runner-socket:/run/cpp-runner
      - ../knowledge:/knowledge
      - ../server/prompts:/app/prompts
    depends_on:
      runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ppt-ai-net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: ppt-ai-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    networks:
      - ppt-ai-net

networks:
  ppt-ai-net:
    driver: bridge

volumes:
  runner-socket:
